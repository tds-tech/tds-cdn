name: internal-notes

# Public repo: block code comments that carry internal notes (names, ticket ids/links, tool references).
# Only files added or modified in the pushed range / pull request are checked.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: node .github/scripts/check-internal-notes.mjs --self-test
      - name: Check comments in changed files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -n "${PR_BASE:-}" ]; then
            HEAD="$PR_HEAD"; BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            HEAD="$GITHUB_SHA"; BASE="$PUSH_BEFORE"
          else
            HEAD="$GITHUB_SHA"; BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")"
          fi
          echo "range: $BASE..$HEAD"
          node .github/scripts/check-internal-notes.mjs "$BASE" "$HEAD"
